name: Build, upload game download and publish Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: quiet-world-web-v1.1
          path: release/quiet-world-web-v1.1.zip
      - name: Publish downloadable game release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view web-v1.1 >/dev/null 2>&1 || gh release create web-v1.1 --target main --title "静室 · 扩展篇 v1.1" --notes "电脑与安卓浏览器共用的静态网页包。包含十二章、现代与过去双线、四种设备小游戏和全封闭头盔动力甲立绘。解压后须通过 HTTP/HTTPS 服务运行，线上版本由 Pages 发布。"
          gh release upload web-v1.1 release/quiet-world-web-v1.1.zip --clobber
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
      failure_reason: ${{ steps.enable.outputs.reason }}
      http_status: ${{ steps.verify.outputs.http_status }}
      assets_ok: ${{ steps.verify.outputs.assets_ok }}
    steps:
      - name: Enable Pages using repository workflow permissions
        id: enable
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          endpoint = 'repos/' + os.environ['GITHUB_REPOSITORY'] + '/pages'
          current = subprocess.run(['gh','api',endpoint], capture_output=True, text=True)
          method = 'PUT' if current.returncode == 0 else 'POST'
          if current.returncode == 0 and json.loads(current.stdout).get('build_type') == 'workflow':
              raise SystemExit(0)
          result = subprocess.run(['gh','api',endpoint,'--method',method,'--input','-'], input=json.dumps({'build_type':'workflow'}), capture_output=True, text=True)
          if result.returncode:
              reason = (result.stderr + ' ' + result.stdout).replace('\n',' ')[:900]
              with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                  out.write('reason=' + reason + '\n')
              print(reason)
              raise SystemExit(result.returncode)
          PYCODE
      - uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed game and static assets
        id: verify
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          python3 - <<'PYCODE'
          import json, os, time, urllib.request, urllib.parse
          from html.parser import HTMLParser
          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.urls = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == 'script' and attrs.get('src'):
                      self.urls.append(attrs['src'])
                  if tag == 'link' and attrs.get('rel') == 'stylesheet' and attrs.get('href'):
                      self.urls.append(attrs['href'])
          url = os.environ['PAGE_URL']
          error = ''
          for attempt in range(6):
              try:
                  with urllib.request.urlopen(url, timeout=20) as response:
                      status = response.status
                      html = response.read().decode('utf-8')
                  if status != 200 or '<title>静室' not in html:
                      raise RuntimeError('Unexpected game page response')
                  parser = Assets()
                  parser.feed(html)
                  if not parser.urls:
                      raise RuntimeError('Game bundle references missing')
                  paths = parser.urls + ['manifest.webmanifest','asset-manifest.json','art/castian-armour.png','art/titus-armour.png','art/thalamas-armour.png']
                  for path in paths:
                      with urllib.request.urlopen(urllib.parse.urljoin(url,path),timeout=20) as response:
                          if response.status != 200 or not response.read(1):
                              raise RuntimeError('Asset unavailable: '+path)
                  with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                      out.write('http_status=200\nassets_ok=true\n')
                  print('Live game page and required bundles/helmeted portraits returned HTTP 200.')
                  break
              except Exception as exc:
                  error = str(exc)
                  print('Waiting for Pages readiness:',error)
                  if attempt == 5:
                      with open(os.environ['GITHUB_OUTPUT'],'a') as out:
                          out.write('http_status=failed\nassets_ok=false\n')
                      raise SystemExit(error)
                  time.sleep(10)
          PYCODE
  report:
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record deployment result for repository users
        env:
          BUILD_STATUS: ${{ needs.build.result }}
          DEPLOY_STATUS: ${{ needs.deploy.result }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          PAGE_URL: ${{ needs.deploy.outputs.page_url }}
          FAILURE_REASON: ${{ needs.deploy.outputs.failure_reason }}
          HTTP_STATUS: ${{ needs.deploy.outputs.http_status }}
          ASSETS_OK: ${{ needs.deploy.outputs.assets_ok }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data = {key.lower(): os.environ.get(key, '') for key in ['BUILD_STATUS','DEPLOY_STATUS','SOURCE_SHA','RUN_ID','PAGE_URL','FAILURE_REASON','HTTP_STATUS','ASSETS_OK']}
          data['actions_url'] = 'https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/actions/runs/' + os.environ['RUN_ID']
          Path('deployment.json').write_text(json.dumps(data, indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          blob=$(git hash-object -w deployment.json)
          tree=$(printf '100644 blob %s\tdeployment.json\n' "$blob" | git mktree)
          if git fetch origin refs/heads/codex-pages-status:refs/remotes/origin/codex-pages-status; then
            parent=$(git rev-parse refs/remotes/origin/codex-pages-status)
            commit=$(git commit-tree "$tree" -p "$parent" -m "Record Pages deployment result")
          else
            commit=$(git commit-tree "$tree" -m "Record Pages deployment result")
          fi
          git push origin "$commit:refs/heads/codex-pages-status"
